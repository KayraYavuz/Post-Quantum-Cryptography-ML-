apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: pqc-cluster-queue
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: spot-gpu
          resources:
            - name: "cpu"
              nominalQuota: 32
            - name: "memory"
              nominalQuota: 128Gi
            - name: "nvidia.com/gpu"
              nominalQuota: 4
        - name: on-demand
          resources:
            - name: "cpu"
              nominalQuota: 16
            - name: "memory"
              nominalQuota: 64Gi
