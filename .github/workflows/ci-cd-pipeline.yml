name: Post-Quantum Cryptography CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  PQC_BENCH_DIR: "/home/node/.openclaw/workspace/Post-Quantum-Cryptography-ML"
  CBOM_POLICY: "CycloneDX-1.6"
  NIST_POLICY: "SP-800-208"
  CNSA_POLICY: "CNSA-2.0"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.setup-python.outputs.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov cyclonedx-bom rich

  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    name: Test Python ${{ matrix.python-version }}
    outputs:
      test-result: ${{ steps.run-tests.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov cyclonedx-bom

      - name: Run unit tests
        id: run-tests
        run: |
          cd $PQC_BENCH_DIR
          python -m pytest tests/ -v --tb=short 2>&1 | tee test_output.log
          RESULT="passed"
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            RESULT="failed"
          fi
          echo "result=$RESULT" >> $GITHUB_OUTPUT

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: tests/*.xml
          if: always()

  cbom:
    needs: test
    runs-on: ubuntu-latest
    name: CBOM Generation & Policy Validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CBOM dependencies
        run: |
          pip install cyclonedx-bom cyclonedx-python-parser

      - name: Generate CBOM
        run: |
          cd $PQC_BENCH_DIR
          python -m pqc_bench.cbom.generator --output artifacts/cbom.xml --policy ${{ env.CBOM_POLICY }}

      - name: Validate CBOM against policies
        run: |
          cd $PQC_BENCH_DIR
          python -m pqc_bench.cbom.policy_evaluator artifacts/cbom.xml \
            --nist-policy ${{ env.NIST_POLICY }} \
            --cnsa-policy ${{ env.CNSA_POLICY }}

  security:
    needs: cbom
    runs-on: ubuntu-latest
    name: Security Estimation & Lattice Analysis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security estimation dependencies
        run: |
          pip install mlkem-native lattice-estimator

      - name: Run security estimation tests
        run: |
          cd $PQC_BENCH_DIR
          python -m pytest tests/test_security_estimation.py -v --tb=short

      - name: Run quantum cost analysis
        run: |
          cd $PQC_BENCH_DIR
          python -m pytest tests/test_quantum_cost.py -v --tb=short

  phase4:
    needs: security
    runs-on: ubuntu-latest
    name: Phase 4: Waveform Visualizer & API Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Phase 4 dependencies
        run: |
          pip install pytest matplotlib

      - name: Run Phase 4 tests
        run: |
          cd $PQC_BENCH_DIR
          python -m pytest tests/test_phase4.py -v --tb=short

      - name: Validate API endpoints
        run: |
          cd $PQC_BENCH_DIR
          python -m pytest tests/ -k "visualize" -v --tb=short

  advanced:
    needs: phase4
    runs-on: ubuntu-latest
    name: Advanced Compliance & CPA/TVLA Analysis
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install advanced analysis dependencies
        run: |
          pip install scipy statsmodels

      - name: Run advanced compliance tests
        run: |
          cd $PQC_BENCH_DIR
          python -m pytest tests/test_advanced.py -v --tb=short

      - name: Verify compliance exporter
        run: |
          cd $PQC_BENCH_DIR
          python -c "from pqc_bench.cbom.report_exporter export_compliance_report(); print('Compliance report exported successfully')"

  summary:
    needs: advanced
    runs-on: ubuntu-latest
    name: Pipeline Summary & Artifacts
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate pipeline summary
        run: |
          echo "=== CI/CD Pipeline Summary ===" >> summary.txt
          echo "Python version: ${{ env.PYTHON_VERSION }}" >> summary.txt
          echo "Workflow run: ${{ github.run_id }}" >> summary.txt
          echo "Commit: ${{ github.sha }}" >> summary.txt
          echo "Status: ${{ needs.test.result || needs.cbom.result || needs.security.result || needs.phase4.result || needs.advanced.result }}" >> summary.txt
          echo "" >> summary.txt
          echo "Test Results:" >> summary.txt
          for result in "${{ needs.test.outputs.test-result }}"; do
            echo "  Python $result" >> summary.txt
          done
          echo "" >> summary.txt
          echo "CBOM Validation: completed" >> summary.txt
          echo "" >> summary.txt
          echo "Phase 4 Tests: completed" >> summary.txt
          echo "" >> summary.txt
          echo "Advanced Compliance: completed" >> summary.txt
          echo "==============================" >> summary.txt

      - name: Upload summary
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-summary
          path: summary.txt